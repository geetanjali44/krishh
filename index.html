<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krishna Janmashtami Banner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
}

body{
    background:#eee;
}


/* =========================
   BANNER
========================= */

.janmashtami-banner{
    position:relative;

    width:100%;
    height:420px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #f4f7f5 0%,
            #68e99d 50%,
            #e3eae6 100%
        );

    contain:layout paint;
}


/* LIGHT CENTER */

.center-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:420px;
    height:420px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(255,255,255,.13);

    pointer-events:none;

    z-index:1;
}


/* =========================
   MANGO THORANA
========================= */

.thorana{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:62px;

    z-index:30;

    pointer-events:none;
}


.thorana-rope{
    position:absolute;

    top:7px;
    left:0;

    width:100%;
    height:6px;

    background:
        repeating-linear-gradient(
            90deg,
            #ffd43b 0 12px,
            #ff8c00 12px 24px
        );
}


.leaves{
    position:absolute;

    left:0;
    top:11px;

    width:100%;

    display:flex;

    justify-content:space-around;
    align-items:flex-start;

    padding:0 8px;
}


.leaf{
    width:22px;
    height:43px;

    flex:0 0 auto;

    background:#168b3a;

    border-radius:
        75% 15% 75% 15%;

    transform:rotate(35deg);

    transform-origin:top center;
}


.leaf:nth-child(even){
    transform:rotate(-35deg);
}


/* =========================
   UTTI
========================= */

.utti{
    position:absolute;

    top:15px;
    left:50%;

    width:100px;
    height:145px;

    transform:translateX(-50%);

    z-index:20;

    pointer-events:none;
}


/* ROPES */

.utti-rope-left,
.utti-rope-right{
    position:absolute;

    top:0;

    width:3px;
    height:68px;

    background:#c68b0b;

    transform-origin:top;
}


.utti-rope-left{
    left:28px;
    transform:rotate(17deg);
}


.utti-rope-right{
    right:28px;
    transform:rotate(-17deg);
}


.utti-center-rope{
    position:absolute;

    top:0;
    left:50%;

    width:3px;
    height:55px;

    transform:translateX(-50%);

    background:#d7a016;
}


/* =========================
   POT
========================= */

.utti-pot{
    position:absolute;

    left:50%;
    top:53px;

    width:72px;
    height:52px;

    transform:translateX(-50%);

    background:#b9571e;

    border:2px solid #ef9c4d;

    border-radius:
        12px 12px 34px 34px;

    z-index:5;
}


.utti-pot::before{
    content:"";

    position:absolute;

    left:50%;
    top:-8px;

    width:77px;
    height:13px;

    transform:translateX(-50%);

    background:#994215;

    border:3px solid #ef9c4d;

    border-radius:50%;
}


.utti-pot::after{
    content:"";

    position:absolute;

    left:50%;
    top:21px;

    width:52px;
    height:8px;

    transform:translateX(-50%);

    border-top:3px solid #ffd67b;
    border-bottom:3px solid #ffd67b;
}


/* =========================
   KRISHNA
========================= */

.krishna-wrap{
    position:absolute;

    left:23%;
    bottom:8px;

    height:330px;

    transform:translateX(-50%);

    z-index:10;
}


.krishna-image{
    display:block;

    height:100%;
    width:auto;

    object-fit:contain;

    transform:none;

    /* no animation */
    animation:none;

    /* lightweight shadow instead of filter */
    filter:none;
}


/* =========================
   KID WITH STICK
========================= */

.kids-play{
    position:absolute;

    right:3%;
    bottom:18px;

    width:330px;
    height:330px;

    z-index:15;

    pointer-events:none;
}


.kids-image{
    position:absolute;

    right:0;
    bottom:0;

    display:block;

    height:255px;
    width:auto;

    object-fit:contain;

    /* fixed position */
    transform:
        translate3d(-75px,-70px,0)
        rotate(-10deg);

    transform-origin:center center;

    animation:none;

    filter:none;

    backface-visibility:hidden;
}


/* =========================
   SIMPLE GROUND
========================= */

.ground-glow{
    position:absolute;

    left:50%;
    bottom:-65px;

    width:480px;
    height:120px;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        rgba(255,255,255,.22);

    z-index:2;

    pointer-events:none;
}


/* =========================
   TABLET
========================= */

@media(max-width:700px){

    .janmashtami-banner{
        height:340px;
    }


    .center-glow{
        width:340px;
        height:340px;
    }


    /* KRISHNA */

    .krishna-wrap{
        left:23%;

        height:270px;

        bottom:7px;
    }


    /* UTTI */

    .utti{
        top:13px;

        transform:
            translateX(-50%)
            scale(.82);

        transform-origin:top center;
    }


    /* LEAVES */

    .leaf{
        width:18px;
        height:35px;
    }


    /* KID */

    .kids-play{
        right:-2px;
        bottom:8px;
        top:35px;
        width:250px;
        height:270px;
    }


    .kids-image{
        height:205px;

        transform:
            translate3d(-50px,-58px,0)
            rotate(-10deg);
    }


    .ground-glow{
        width:380px;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .janmashtami-banner{
        height:310px;
    }


    .center-glow{
        width:300px;
        height:300px;
    }


    /* KRISHNA */

    .krishna-wrap{
        left:20%;

        height:235px;

        bottom:7px;
    }


    /* UTTI */

    .utti{
        top:9px;

        transform:
            translateX(-50%)
            scale(.74);

        transform-origin:top center;
    }


    /* LEAVES */

    .leaf{
        width:15px;
        height:30px;
    }


    /* KID */

    .kids-play{
        right:-12px;
        bottom:0;

        width:200px;
        height:220px;
    }


    .kids-image{
        height:165px;

        transform:
            translate3d(-38px,-48px,0)
            rotate(-10deg);
    }


    .ground-glow{
        width:300px;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:360px){

    .janmashtami-banner{
        height:285px;
    }


    .krishna-wrap{
        left:21%;

        height:210px;

        bottom:5px;
    }


    .utti{
        transform:
            translateX(-50%)
            scale(.68);

        transform-origin:top center;
    }


    .leaf{
        width:13px;
        height:27px;
    }


    .kids-play{
        right:-15px;

        width:175px;
        height:195px;
    }


    .kids-image{
        height:145px;

        transform:
            translate3d(-30px,-42px,0)
            rotate(-10deg);
    }
}


/* =========================
   REDUCE MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *{
        animation:none !important;
        transition:none !important;
    }
}

</style>
</head>

<body>


<section class="janmashtami-banner">


    <!-- LIGHT BACKGROUND -->

    <div class="center-glow"></div>


    <!-- =====================
         MANGO THORANA
    ====================== -->

    <div class="thorana">

        <div class="thorana-rope"></div>

        <div class="leaves">

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>

            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>
            <div class="leaf"></div>

        </div>

    </div>


    <!-- =====================
         UTTI
    ====================== -->

    <div class="utti">

        <div class="utti-rope-left"></div>

        <div class="utti-center-rope"></div>

        <div class="utti-rope-right"></div>

        <div class="utti-pot"></div>

    </div>


    <!-- =====================
         KRISHNA
    ====================== -->

    <div class="krishna-wrap">

        <img
            src="krishna.png"
            class="krishna-image"
            alt="Baby Krishna"
            decoding="async"
            draggable="false"
        >

    </div>


    <!-- =====================
         FIXED KID + STICK
    ====================== -->

    <div class="kids-play">

        <img
            src="kid.png"
            class="kids-image"
            alt="Kid Hitting Utti"
            decoding="async"
            draggable="false"
        >

    </div>


    <!-- GROUND -->

    <div class="ground-glow"></div>


</section>


</body>
</html>
